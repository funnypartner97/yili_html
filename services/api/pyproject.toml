[project]
name = "html-office-api"
version = "0.1.0"
description = "API and worker service for HTML Office"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.0",
    "arq==0.28.0",
    "fastapi==0.141.1",
    "openai==3.14.1",
    "openpyxl==3.1.5",
    "pydantic==2.13.5",
    "psycopg[binary]>=3.3,<4",
    "jsonschema>=4.26,<5",
    "PyMuPDF==1.28.2",
    "python-docx==1.2.0",
    "python-pptx==1.0.2",
    "SQLAlchemy==2.0.54",
    "uvicorn==0.40.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    "ignore:The anyio\\.abc\\.BlockingPortal alias is deprecated:DeprecationWarning:starlette\\.testclient",
]
